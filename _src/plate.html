<!doctype html>
<!-- Renders one resting plate (the design kit's Plate.still) to fill the window, for the hero image and the card.
     Built by _src/build.sh; the design kit is copied in vendor/plate.js (from design/worlds/devices/kit/plate.js in the Habits workspace). -->
<html lang="en"><head><meta charset="utf-8"><title>plate still</title>
<style>html,body{margin:0;background:#0a0c0f;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="vendor/plate.js"></script>
<script>
const q = new URLSearchParams(location.search);
const w = +q.get('w') || innerWidth, h = +q.get('h') || innerHeight;
const c = document.getElementById('c'); c.style.width = w + 'px'; c.style.height = h + 'px';
Plate.still(c, { w, h, dpr: +q.get('dpr') || 2, hour: q.has('hour') ? +q.get('hour') : 9, seed: +q.get('seed') || 11,
  grains: q.has('grains') ? +q.get('grains') : undefined,
  habits: [{ key: 'read', slot: 0, votes: 14 }, { key: 'walk', slot: 1, votes: 13 }, { key: 'screens', slot: 2, votes: 11 }] });
</script></body></html>
